<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetMesai - İK ve PDKS Platformu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #F7F8FA;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
        }

        .screen.active {
            display: flex;
        }

        .login-container {
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .logo-box {
            text-align: center;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 40px;
            color: #163C38;
        }

        .logo-box h2 {
            color: #163C38;
            margin-top: 5px;
        }

        .logo-box p {
            color: #777;
            font-size: 12px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            background: #f1f3f5;
            border: none;
            border-radius: 10px;
            outline: none;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .forgot-pass {
            color: #163C38;
            text-decoration: none;
        }

        .btn-primary {
            background: #222;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            width: 100%;
        }

        .btn-outline {
            background: transparent;
            color: #163C38;
            border: 2px solid #163C38;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .app-header {
            background: #163C38;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-logout, .btn-back {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .dashboard-content {
            padding: 20px;
            flex-grow: 1;
        }

        .welcome-card {
            background: linear-gradient(135deg, #E0F2F1, #B2DFDB);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .avatar-icon {
            font-size: 35px;
            color: #163C38;
            background: white;
            padding: 10px;
            border-radius: 50%;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #eee;
        }

        .card i {
            font-size: 30px;
            color: #163C38;
            margin-bottom: 10px;
            display: block;
        }

        .card span {
            font-weight: bold;
            font-size: 14px;
            color: #163C38;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-content input, .modal-content select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: #ccc;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
        }

        .pdks-container {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 20px;
        }

        .qr-box {
            width: 180px;
            height: 180px;
            border: 3px solid #163C38;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-box i {
            font-size: 80px;
            color: #163C38;
        }

        .pdks-container input {
            width: 100%;
            padding: 12px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .personnel-container {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            position: relative;
        }

        ul { list-style: none; }

        .user-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
        }

        .floating-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: calc(100% - 40px);
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="logo-box">
                <i class="fa-solid fa-infinity logo-icon"></i>
                <h2>NetMesai</h2>
                <p>Yeni Nesil İK ve PDKS Çözümü</p>
            </div>
            
            <h3>Giriş Yap</h3>
            <br>
            <div class="input-group">
                <i class="fa-regular fa-envelope"></i>
                <input type="text" id="login-id" placeholder="E-Posta veya Telefon">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-pass" placeholder="Parola">
            </div>
            
            <div class="login-options">
                <label><input type="checkbox"> Beni Hatırla</label>
                <a href="#" class="forgot-pass">Şifre Al / Yenile</a>
            </div>

            <button class="btn-primary" onclick="login()">Giriş Yap</button>
            <button class="btn-outline" onclick="openBossModal()">Patron Girişi</button>
        </div>
    </div>

    <!-- PATRON GİRİŞ MODALI -->
    <div id="boss-modal" class="modal">
        <div class="modal-content">
            <h3>Patron / Admin Girişi</h3>
            <input type="text" id="boss-user" placeholder="Kullanıcı Adı (admin)">
            <input type="password" id="boss-pass" placeholder="Şifre (1234)">
            <div class="modal-buttons">
                <button onclick="closeBossModal()" class="btn-secondary">İptal</button>
                <button onclick="bossLogin()" class="btn-primary">Giriş Yap</button>
            </div>
        </div>
    </div>

    <!-- ANA PANEL (DASHBOARD) -->
    <div id="dashboard-screen" class="screen">
        <header class="app-header">
            <h2 id="panel-title">NetMesai Paneli</h2>
            <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </header>

        <div class="dashboard-content">
            <div class="welcome-card">
                <i class="fa-solid fa-user-tie avatar-icon"></i>
                <div>
                    <h3 id="welcome-name">Hoşgeldin, Kullanıcı</h3>
                    <p id="welcome-role">Yetki: Personel</p>
                </div>
            </div>

            <div class="grid-menu">
                <div class="card" onclick="openPdks()">
                    <i class="fa-solid fa-qrcode"></i>
                    <span>PDKS Giriş/Çıkış</span>
                </div>
                <div class="card" onclick="openShifts()">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Vardiya Programı</span>
                </div>
                <div class="card" id="admin-menu-card" onclick="openPersonnel()" style="display: none;">
                    <i class="fa-solid fa-users-gear"></i>
                    <span>Personel Yönetimi</span>
                </div>
                <div class="card" onclick="alert('İzin Talep modülü açıldı.')">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>İzin Talebi</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PDKS QR OKUYUCU EKRANI -->
    <div id="pdks-screen" class="screen">
        <header class="app-header">
            <button onclick="backToDashboard()" class="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>PDKS QR Okuyucu</h2>
        </header>
        <div class="pdks-container">
            <div class="qr-box">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <input type="number" id="qr-input" placeholder="QR Kodu Girin (Örn: 123)">
            <button class="btn-primary" onclick="verifyQr()">Kodu Doğrula</button>
            <p id="qr-result"></p>
        </div>
    </div>

    <!-- PERSONEL YÖNETİMİ EKRANI -->
    <div id="personnel-screen" class="screen">
        <header class="app-header">
            <button onclick="backToDashboard()" class="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>Personel ve Yetki Yönetimi</h2>
        </header>
        <div class="personnel-container">
            <ul id="personnel-list"></ul>
            <button class="btn-primary floating-btn" onclick="openAddUserModal()">+ Yeni Personel Ekle</button>
        </div>
    </div>

    <!-- YENİ PERSONEL EKLEME MODALI -->
    <div id="add-user-modal" class="modal">
        <div class="modal-content">
            <h3>Yeni Personel Ekle</h3>
            <input type="text" id="new-name" placeholder="Ad Soyad">
            <select id="new-role">
                <option value="Personel">Personel</option>
                <option value="Yönetici">Yönetici</option>
            </select>
            <div class="modal-buttons">
                <button onclick="closeAddUserModal()" class="btn-secondary">İptal</button>
                <button onclick="addUser()" class="btn-primary">Ekle</button>
            </div>
        </div>
    </div>

    <script>
        let users = [
            { name: "Ahmet Yılmaz", role: "Personel", status: "Giriş Yapmadı" },
            { name: "Mehmet Demir", role: "Yönetici", status: "Çalışıyor" }
        ];

        let currentUser = null;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function login() {
            currentUser = { name: "Ahmet Yılmaz", role: "Personel" };
            setupDashboard();
        }

        function openBossModal() { document.getElementById('boss-modal').style.display = 'flex'; }
        function closeBossModal() { document.getElementById('boss-modal').style.display = 'none'; }

        function bossLogin() {
            const user = document.getElementById('boss-user').value;
            const pass = document.getElementById('boss-pass').value;

            if(user === "admin" && pass === "1234") {
                closeBossModal();
                currentUser = { name: "Şirket Patronu", role: "Patron" };
                setupDashboard();
            } else {
                alert("Hatalı Patron Bilgisi! (Kullanıcı: admin, Şifre: 1234)");
            }
        }

        function setupDashboard() {
            document.getElementById('welcome-name').innerText = `Hoşgeldin, ${currentUser.name}`;
            document.getElementById('welcome-role').innerText = `Yetki Seviyesi: ${currentUser.role}`;
            document.getElementById('panel-title').innerText = `NetMesai (${currentUser.role} Paneli)`;

            const adminCard = document.getElementById('admin-menu-card');
            if(currentUser.role === "Patron" || currentUser.role === "Yönetici") {
                adminCard.style.display = "block";
            } else {
                adminCard.style.display = "none";
            }

            showScreen('dashboard-screen');
        }

        function logout() {
            currentUser = null;
            showScreen('login-screen');
        }

        function backToDashboard() {
            showScreen('dashboard-screen');
        }

        function openPdks() { showScreen('pdks-screen'); }

        function verifyQr() {
            const code = document.getElementById('qr-input').value.trim();
            const resultText = document.getElementById('qr-result');

            if(code === "123") {
                resultText.innerHTML = "✅ Başarılı! Giriş/Çıkış onaylandı.";
                resultText.style.color = "green";
            } else {
                resultText.innerHTML = "❌ Geçersiz Kod! Doğru kod: 123";
                resultText.style.color = "red";
            }
        }

        function openPersonnel() {
            renderPersonnelList();
            showScreen('personnel-screen');
        }

        function renderPersonnelList() {
            const listEl = document.getElementById('personnel-list');
            listEl.innerHTML = "";
            users.forEach((u, index) => {
                listEl.innerHTML += `
                    <li class="user-item">
                        <div>
                            <strong>${u.name}</strong><br>
                            <small>Rol: ${u.role} | Durum: ${u.status}</small>
                        </div>
                        <button onclick="deleteUser(${index})" style="background:none; border:none; color:red; cursor:pointer; font-size:16px;">🗑️</button>
                    </li>
                `;
            });
        }

        function openAddUserModal() { document.getElementById('add-user-modal').style.display = 'flex'; }
        function closeAddUserModal() { document.getElementById('add-user-modal').style.display = 'none'; }

        function addUser() {
            const name = document.getElementById('new-name').value.trim();
            const role = document.getElementById('new-role').value;

            if(name) {
                users.push({ name: name, role: role, status: "Aktif Değil" });
                closeAddUserModal();
                renderPersonnelList();
            } else {
                alert("Lütfen isim girin.");
            }
        }

        function deleteUser(index) {
            users.splice(index, 1);
            renderPersonnelList();
        }

        function openShifts() {
            alert("Vardiya Programı ekranı açılıyor.");
        }
    </script>
</body>
</html>
